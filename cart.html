<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adorn — Cart</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="header-inner"><a href="index.html"><img class="logo-img" src="adorn-logo.png" alt="Adorn"></a><button class="menu-btn">☰</button><nav class="nav"><a href="index.html">HOME</a><a href="rings.html">RINGS</a><a href="chains.html">CHAINS</a><a href="bracelets.html">BRACELETS</a><a class="active cart-link" href="cart.html">CART <span class="cart-count">0</span></a></nav></div></header>
<section class="page-hero"><div class="eyebrow">YOUR SELECTION</div><h1>Your Cart</h1><p>Choose more than one piece. Adjust quantities and see your total instantly.</p></section>
<main class="cart-wrap"><div id="items"></div><div class="cart-total"><span>TOTAL</span><strong id="total">0.00 EGP</strong></div><button id="checkoutBtn" class="btn full">PLACE ORDER</button><div id="checkout" class="checkout-box hidden"><h2>Order details</h2><p class="muted">Your cart can contain multiple products. The total below includes all quantities.</p><form id="orderForm"><div class="checkout-grid"><label class="field">NAME<input id="customerName" required></label><label class="field">PHONE<input id="customerPhone" type="tel" required></label></div><label class="field">ADDRESS<textarea id="customerAddress" rows="4" required></textarea></label><div class="order-summary" id="orderSummary"></div><button class="btn full" type="submit">CONFIRM ORDER</button><div id="orderMsg" class="message"></div></form></div></main><footer>© 2026 ADORN — YOUR STORY</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
let cart=[];
function render(){updateCartCount();document.getElementById("total").textContent=cart.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||0),0).toFixed(2)+" EGP";document.getElementById("items").innerHTML=cart.length?cart.map((x,i)=>'<div class="cart-item"><div class="cart-thumb">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">':'')+'<span class="placeholder" style="'+(x.image_url?'display:none':'')+'">ADORN</span></div><div><h3>'+esc(x.name)+'</h3><div class="muted">'+Number(x.price||0).toFixed(2)+' EGP each</div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><span>'+x.qty+'</span><button onclick="changeQty('+i+',1)">+</button><button class="remove" onclick="removeItem('+i+')">Remove</button></div></div><div class="price">'+(Number(x.price||0)*Number(x.qty||0)).toFixed(2)+' EGP</div></div>').join(""):'<div class="empty">Your cart is empty.</div>';document.getElementById("checkoutBtn").style.display=cart.length?"":"none";}
function changeQty(i,n){cart[i].qty=Number(cart[i].qty||0)+n;if(cart[i].qty<1)cart.splice(i,1);saveCart(cart);render()}
function removeItem(i){cart.splice(i,1);saveCart(cart);render()}
function showCheckout(){if(!cart.length)return;document.getElementById("checkout").classList.remove("hidden");document.getElementById("orderSummary").innerHTML='<strong>ORDER SUMMARY</strong><br>'+cart.map(x=>esc(x.name)+' × '+x.qty+' — '+(Number(x.price)*Number(x.qty)).toFixed(2)+' EGP').join('<br>')+'<br><br><strong>TOTAL: '+cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0).toFixed(2)+' EGP</strong>';document.getElementById("checkout").scrollIntoView({behavior:"smooth",block:"start"})}
document.getElementById("checkoutBtn").onclick=showCheckout;
document.getElementById("orderForm").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("orderMsg");msg.className="message";msg.textContent="Sending order…";const total=cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0);const payload={customer_name:document.getElementById("customerName").value.trim(),customer_phone:document.getElementById("customerPhone").value.trim(),customer_address:document.getElementById("customerAddress").value.trim(),items:cart.map(x=>({id:x.id,name:x.name,price:Number(x.price),qty:Number(x.qty),image_url:x.image_url||null})),total};try{const r=await sb.from("orders").insert(payload);if(r.error)throw r.error;msg.className="message success";msg.textContent="Order received successfully. Thank you!";localStorage.removeItem("adornCart");cart=[];render();document.getElementById("orderForm").reset()}catch(err){msg.className="message error";msg.textContent=err.message||"Could not send the order. Run the updated setup.sql in Supabase first."}};
(async()=>{cart=await hydrateCartImages();render()})();
</script></body></html>
