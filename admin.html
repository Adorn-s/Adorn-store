<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adorn — Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="header-inner"><a href="index.html"><img class="logo-img" src="adorn-logo.png" alt="Adorn"></a><nav class="nav" style="display:flex"><a href="index.html">VIEW STORE</a></nav></div></header>
<div id="login" class="auth-wrap"><form id="login-form" class="auth"><div class="eyebrow">PRIVATE AREA</div><h1>Admin Login</h1><p class="muted">Sign in with your Supabase Admin account.</p><label class="field">EMAIL<input id="email" type="email" value="sj3783967@gmail.com" required></label><label class="field">PASSWORD<input id="password" type="password" required></label><button class="btn full">LOG IN</button><div id="login-msg" class="message"></div></form></div>
<div id="dashboard" class="admin hidden"><div class="admin-top"><div><div class="eyebrow">ADORN ADMIN</div><h1>Products</h1></div><button id="logout" class="btn ghost">LOG OUT</button></div><div class="admin-grid">
<form id="product-form" class="panel"><h2>Add product</h2><label class="field">NAME<input id="name" required></label><label class="field">PRICE<input id="price" type="number" min="0" step="0.01" required></label><label class="field">CATEGORY<input id="category" placeholder="Rings / Chains / Bracelets" required></label><label class="field">PRODUCT IMAGE<input id="image" type="file" accept="image/*" required><small class="muted">Choose the product photo from your computer.</small><img id="image-preview" class="admin-preview" alt="Preview" style="display:none"></label><label class="field">DESCRIPTION<textarea id="description" rows="5"></textarea></label><button class="btn full">ADD PRODUCT</button><div id="product-msg" class="message"></div></form>
<div class="panel"><h2>Current products</h2><div id="admin-list"></div></div></div><div class="panel orders-panel"><h2>Customer orders</h2><div id="orders-list"><p class="muted">Loading orders…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
const preview=document.getElementById("image-preview");document.getElementById("image").onchange=()=>{const f=document.getElementById("image").files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display="block"}};const adminEmail=(cfg.ADMIN_EMAIL||"").trim().toLowerCase();
const loginBox=document.getElementById("login"),dashboard=document.getElementById("dashboard"),loginForm=document.getElementById("login-form"),loginMsg=document.getElementById("login-msg");
function configured(){return !!(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&cfg.ADMIN_EMAIL)}
function showLogin(msg=""){loginBox.classList.remove("hidden");dashboard.classList.add("hidden");loginMsg.textContent=msg}
function showDashboard(){loginBox.classList.add("hidden");dashboard.classList.remove("hidden");load()}
async function checkSession(){if(!configured()){showLogin("Supabase configuration is missing. Check config.js.");return}try{const {data,error}=await sb.auth.getSession();if(error)throw error;const u=data?.session?.user;if(u?.email?.trim().toLowerCase()===adminEmail)showDashboard();else showLogin("")}catch(e){showLogin("Could not check login: "+(e.message||e))}}
loginForm.onsubmit=async e=>{e.preventDefault();if(!configured()){showLogin("Supabase configuration is missing. Check config.js.");return}loginMsg.className="message";loginMsg.textContent="Signing in…";const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const logged=(data?.user?.email||"").trim().toLowerCase();if(logged!==adminEmail){await sb.auth.signOut();throw new Error("This account is not the owner account.")}loginMsg.textContent="";showDashboard()}catch(e){loginMsg.className="message error";loginMsg.textContent=e.message||"Login failed."}}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();showLogin("")};
document.getElementById("product-form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("product-msg"),name=document.getElementById("name").value.trim(),price=Number(document.getElementById("price").value),category=document.getElementById("category").value.trim(),description=document.getElementById("description").value.trim()||null,file=document.getElementById("image").files[0];m.className="message";m.textContent="";if(!name){m.className="message error";m.textContent="Product name is required.";return}if(!file){m.className="message error";m.textContent="Choose a product image.";return}if(!file.type.startsWith("image/")){m.className="message error";m.textContent="Please choose an image file.";return}try{m.textContent="Uploading image…";const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=`${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from("products").upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;const {data:pub}=sb.storage.from("products").getPublicUrl(path);const image_url=pub.publicUrl;const r=await sb.from("products").insert({name,price,category,image_url,description});if(r.error){await sb.storage.from("products").remove([path]);throw r.error}m.className="message success";m.textContent="Product added successfully.";e.target.reset();load()}catch(err){console.error(err);m.className="message error";m.textContent=err.message||"Could not upload the image."}};
async function load(){const r=await sb.from("products").select("id,name,price,category,image_url").order("created_at",{ascending:false}),box=document.getElementById("admin-list");box.innerHTML=r.error?'<p class="message error">'+esc(r.error.message)+'</p>':(r.data||[]).map(p=>'<div class="admin-item"><div style="display:flex;gap:12px;align-items:center">'+(p.image_url?'<img class="admin-thumb" src="'+esc(p.image_url)+'" alt="">':'')+'<div><strong>'+esc(p.name)+'</strong><div class="muted">'+Number(p.price||0).toFixed(2)+' · '+esc(p.category||'')+'</div></div></div><button class="danger" onclick="del(\''+p.id+'\')">DELETE</button></div>').join("")||'<p class="muted">No products yet.</p>';await loadOrders()}
async function del(id){if(!confirm("Delete this product?"))return;const q=await sb.from("products").select("image_url").eq("id",id).single();const r=await sb.from("products").delete().eq("id",id);if(r.error){alert(r.error.message);return}if(q.data?.image_url){const marker='/storage/v1/object/public/products/';const idx=q.data.image_url.indexOf(marker);if(idx>=0){const path=q.data.image_url.slice(idx+marker.length);await sb.storage.from("products").remove([path])}}load()}
async function loadOrders(){const box=document.getElementById("orders-list");if(!box)return;const r=await sb.from("orders").select("id,customer_name,customer_phone,customer_address,items,total,created_at").order("created_at",{ascending:false});if(r.error){box.innerHTML='<p class="message error">'+esc(r.error.message)+'</p>';return}box.innerHTML=(r.data||[]).map(o=>{const items=Array.isArray(o.items)?o.items:[];return '<div class="order-card"><div class="order-head"><strong>'+esc(o.customer_name)+'</strong><span>'+Number(o.total||0).toFixed(2)+' EGP</span></div><div class="muted">'+esc(o.customer_phone)+' · '+esc(o.customer_address)+'</div><div class="order-items">'+items.map(x=>esc(x.name)+' × '+Number(x.qty||0)).join('<br>')+'</div><small class="muted">'+esc(new Date(o.created_at).toLocaleString())+'</small></div>'}).join("")||'<p class="muted">No orders yet.</p>'}
checkSession();
</script></body></html>
