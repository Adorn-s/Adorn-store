<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adorn — Chains</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="header-inner"><a href="index.html"><img class="logo-img" src="adorn-logo.png" alt="Adorn"></a><button class="menu-btn">☰</button><nav class="nav"><a href="index.html">HOME</a><a href="rings.html" >RINGS</a><a href="chains.html" class="active">CHAINS</a><a href="bracelets.html" >BRACELETS</a><a class="cart-link" href="cart.html">CART <span class="cart-count">0</span></a></nav></div></header>
<section class="page-hero"><div class="eyebrow">ADORN COLLECTION</div><h1>Chains</h1><p>Explore the collection and tap any piece to see it up close.</p></section>
<main class="section" style="padding-top:15px"><div id="grid" class="product-grid"></div></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div id="modal-img" class="modal-img"></div><div class="modal-info"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">ChainsUP</div><h2 id="modal-name"></h2><div id="modal-price" class="modal-price"></div><p id="modal-desc" class="modal-desc"></p><button id="modal-add" class="btn full">ADD TO CART</button></div></div></div>
<footer>© 2026 ADORN — YOUR STORY</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="common.js"></script><script>
const category="Chains";let products=[];
async function loadProducts(){const r=await sb.from("products").select("id,name,price,description,image_url,category").ilike("category",category).order("created_at",{ascending:false});products=r.data||[];const g=document.getElementById("grid");g.innerHTML=products.length?products.map((p,i)=>'<article class="product-card" onclick="openModal('+i+')"><div class="product-img">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<span class="placeholder">ADORN</span>')+'</div><div class="product-info"><h3>'+esc(p.name)+'</h3><div class="meta"><span>'+esc(category)+'</span><strong>'+Number(p.price||0).toFixed(2)+'</strong></div></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">No products in this collection yet.</div>'}
function openModal(i){const p=products[i];document.getElementById("modal-name").textContent=p.name;document.getElementById("modal-price").textContent=Number(p.price||0).toFixed(2);document.getElementById("modal-desc").textContent=p.description||"A signature Adorn piece.";document.getElementById("modal-img").innerHTML=p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'">':'<span class="placeholder">ADORN</span>';document.getElementById("modal-add").onclick=()=>addToCart(p);document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}loadProducts();
</script></body></html>
